<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Творения reusrush — галерея работ.">
  <title>Творения reusrush</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="loader" class="loader">
    <div class="loader-dot"></div>
  </div>

  <header class="topbar">
    <nav class="socials" aria-label="Links">
      <a href="https://www.donationalerts.com/r/reusrush" target="_blank" rel="noopener">Donate</a>
      <button id="creditsBtn" class="nav-link" type="button">Создано</button>
    </nav>

    <div class="search-wrap">
      <input id="search" type="search" placeholder="Поиск по названию..." autocomplete="off">
      <button id="clearSearch" aria-label="Очистить">×</button>
    </div>

    <div class="top-actions">
      <button id="languageBtn" class="secondary language-button" type="button">English</button>
      <button id="adminBtn" class="admin-trigger" aria-label="Открыть вход">⌘</button>
    </div>
  </header>

  <main>
    <section id="searchInfo" class="search-info hidden"></section>
    <section id="gallery" class="gallery"></section>

    <section id="empty" class="empty hidden">
      <div class="empty-symbol">⌕</div>
      <h2 id="emptyTitle">Ничего не найдено</h2>
      <p id="emptyText">Попробуй другое название.</p>
    </section>
  </main>

  <div id="creditsModal" class="modal hidden">
    <div class="modal-card credits-card">
      <button id="closeCredits" class="close" aria-label="Close">×</button>
      <span class="eyebrow">CREDITS</span>
      <h1 id="creditsHeading">Создано</h1>
      <div id="creditsText" class="credits-text"></div>
      <button id="editCreditsBtn" class="secondary hidden" type="button">Изменить кредиты</button>
      <div id="creditsEditor" class="hidden">
        <label id="creditsRuLabel">Текст на русском<textarea id="creditsRuInput" maxlength="5000"></textarea></label>
        <label id="creditsEnLabel">Text in English<textarea id="creditsEnInput" maxlength="5000"></textarea></label>
        <button id="saveCredits" type="button">Сохранить</button>
        <div id="creditsStatus" class="status"></div>
      </div>
    </div>
  </div>

  <div id="adminModal" class="modal hidden">
    <div class="modal-card">
      <button id="closeModal" class="close" aria-label="Закрыть">×</button>

      <div id="loginView">
        <span class="eyebrow">PRIVATE AREA</span>
        <h1>Администрирование</h1>
        <p class="muted">Введи код, чтобы открыть управление работами.</p>

        <form id="loginForm">
          <p id="loginPatternHint" class="pattern-help">Проведи линию по 4–9 точкам.</p>
          <div id="loginPattern" class="pattern-pad" role="group" aria-label="Графический пароль"></div>
          <button id="loginDone" type="submit">Готово</button>
          <div id="loginError" class="error"></div>
        </form>
      </div>

      <div id="adminView" class="hidden">
        <div class="admin-title">
          <div>
            <span class="eyebrow">ADMIN</span>
            <h1>Новая работа</h1>
          </div>
          <button id="logoutBtn" class="secondary">Выйти</button>
        </div>

        <div class="pattern-settings">
          <button id="patternSettingsBtn" class="secondary" type="button">Изменить графический пароль</button>
          <div id="patternEditor" class="hidden">
            <p id="patternEditorHint" class="pattern-help">Нарисуй новый узор. Если не рисовать точки, пароль будет очищен.</p>
            <div id="adminPattern" class="pattern-pad" role="group" aria-label="Новый графический пароль"></div>
            <button id="savePattern" type="button">Готово</button>
            <div id="patternStatus" class="status"></div>
          </div>
        </div>

        <form id="uploadForm">
          <div class="language-input">
            <label>Название <span class="field-language" data-field-language="title">RU</span>
              <input name="title" data-lang-field="title" data-lang="ru" maxlength="120" required placeholder="Название работы">
              <input name="title_en" data-lang-field="title" data-lang="en" maxlength="120" placeholder="Artwork title" hidden>
            </label>
            
          </div>
          <div class="language-input">
            <label>Описание <span class="field-language" data-field-language="description">RU</span>
              <textarea name="description" data-lang-field="description" data-lang="ru" maxlength="500" placeholder="Описание работы"></textarea>
              <textarea name="description_en" data-lang-field="description" data-lang="en" maxlength="500" placeholder="Artwork description" hidden></textarea>
            </label>
            
          </div>

          <label class="file-picker">
            <input id="imageInput" name="image" type="file"
              accept="image/png,image/jpeg,image/webp,image/gif" required>
            <span id="fileName">Выбрать картинку</span>
          </label>

          <button type="submit" class="publish">Выложить</button>
          <div id="uploadStatus" class="status"></div>
        </form>

        <div class="manage">
          <div class="manage-heading">Опубликованные работы</div>
          <div id="manageList"></div>
        </div>
      </div>
    </div>
  </div>

  <template id="artTemplate">
    <article class="art-card">
      <div class="image-wrap">
        <img loading="lazy" alt="">
      </div>
      <div class="art-text">
        <h2></h2>
        <p></p>
      </div>
    </article>
  </template>

  <script src="/app.js"></script>
</body>
</html>
